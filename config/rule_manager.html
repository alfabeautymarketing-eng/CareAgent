<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentCare • Правила синхронизации (GAS-Native)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --bg-glass: rgba(15, 23, 42, 0.8);
            --card: #1e293b;
            --card-hover: #2d3748;
            --ink: #f8fafc;
            --muted: #94a3b8;
            --accent: #0d9488;
            --accent-glow: rgba(13, 148, 136, 0.3);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --warning: #f59e0b;
            --success: #10b981;
            --radius-xl: 16px;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --font: 'Inter', system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--font);
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glass Background Effect */
        body::before {
            content: "";
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background:
                radial-gradient(circle at 10% 20%, rgba(13, 148, 136, 0.08), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(245, 158, 11, 0.05), transparent 40%);
            z-index: -1;
        }

        .app {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.5s ease-out;
        }

        /* --- Header & Stats Card --- */
        .stats-panel {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-xl);
            padding: 32px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header-row h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        /* --- Buttons --- */
        .btn {
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-family: inherit;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn.primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn.primary:hover {
            transform: translateY(-1px);
            background: #0f766e;
            box-shadow: 0 6px 16px var(--accent-glow);
        }

        .btn.secondary {
            background: rgba(148, 163, 184, 0.1);
            color: var(--ink);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn.secondary:hover {
            background: rgba(148, 163, 184, 0.2);
        }

        .btn.ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn.ghost:hover {
            color: var(--ink);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn.outline-teal {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .btn.outline-teal:hover {
            background: var(--accent-glow);
        }

        /* --- Filters & Search --- */
        .filter-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 12px 10px 36px;
            color: var(--ink);
            font-size: 14px;
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            opacity: 0.5;
        }

        .wizard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--primary);
        }

        .wizard-panel {
            background: rgba(13, 148, 136, 0.05);
            border: 1px solid rgba(13, 148, 136, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin: 16px 0;
            display: none;
        }

        .wizard-panel.active {
            display: block;
        }

        .wizard-content {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .toggle-mini {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }

        /* --- Badges & Stats --- */
        .stats-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .stat-badge .label {
            color: var(--muted);
        }

        .stat-badge .value {
            font-weight: 700;
            color: var(--ink);
        }

        /* --- Rules List --- */
        .group {
            margin-bottom: 32px;
        }

        .group-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            cursor: pointer;
        }

        .group-header .chevron {
            font-size: 12px;
            color: var(--muted);
            transition: transform 0.2s;
        }

        .group.collapsed .chevron {
            transform: rotate(-90deg);
        }

        .group.collapsed .rules-grid {
            display: none;
        }

        .group-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: var(--accent-glow);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .group-count {
            font-size: 12px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .rules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
        }

        .rule-card {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(---radius);
            padding: 20px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .rule-card:hover {
            transform: translateY(-4px);
            background: var(--card-hover);
            border-color: rgba(13, 148, 136, 0.3);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
        }

        .rule-card.disabled {
            opacity: 0.5;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .card-badges {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .pill {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
            width: fit-content;
        }

        .pill.category {
            background: rgba(13, 148, 136, 0.15);
            color: #2dd4bf;
        }

        .pill.mode {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
        }

        .pill.bidir {
            background: rgba(139, 92, 246, 0.1);
            color: #a78bfa;
        }

        .sync-flow {
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sync-flow span {
            color: var(--muted);
            font-weight: 400;
        }

        .col-info {
            font-size: 13px;
            color: var(--muted);
        }

        .col-info strong {
            color: var(--ink);
        }

        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .card-actions .btn {
            flex: 1;
            justify-content: center;
            padding: 8px;
            font-size: 12px;
        }

        .btn-edit {
            background: rgba(148, 163, 184, 0.1);
            color: var(--ink);
        }

        .btn-delete {
            background: var(--danger-bg);
            color: var(--danger);
        }

        /* --- Toggles --- */
        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--accent);
        }

        input:checked+.slider:before {
            transform: translateX(16px);
        }

        /* --- Modals --- */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.2s ease;
        }

        .modal-body {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-xl);
            width: min(650px, 95vw);
            max-height: 90vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 22px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field label {
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
        }

        .form-input,
        .form-select {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--ink);
            font-size: 14px;
            outline: none;
        }

        .form-input:focus,
        .form-select:focus {
            border-color: var(--accent);
        }

        .help-text {
            font-size: 11px;
            color: var(--muted);
            font-style: italic;
        }

        .shared-column-wizard {
            background: rgba(13, 148, 136, 0.05);
            border: 1px dashed var(--accent);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            display: none;
        }

        .shared-column-wizard.active {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        /* --- Logs View --- */
        #logsModal .modal-body {
            width: min(1000px, 98vw);
        }

        .log-table-container {
            overflow-x: auto;
            margin-top: 16px;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .log-table th {
            text-align: left;
            padding: 10px;
            color: var(--muted);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-table td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .log-status.SUCCESS {
            color: var(--success);
        }

        .log-status.ERROR {
            color: var(--danger);
        }

        /* --- Notifications --- */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: #1e293b;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--accent);
            animation: slideIn 0.3s ease-out;
            max-width: 350px;
            font-size: 13px;
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {

            .header-row,
            .form-row {
                grid-template-columns: 1fr;
                flex-direction: column;
                align-items: stretch;
            }

            .header-actions {
                margin-top: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <section class="stats-panel">
            <div class="header-row">
                <h1>Правила синхронизации</h1>
                <div class="header-actions">
                    <button class="btn ghost outline-teal" onclick="openLogsModal()">📜 Журнал</button>
                    <button class="btn secondary" onclick="reloadRules()">🔄</button>
                    <button class="btn primary" onclick="openRuleModal()">＋ Правило</button>
                </div>
            </div>

            <div class="filter-bar">
                <div class="search-box">
                    <input type="text" id="search" placeholder="Поиск по правилам..." oninput="updateFilters()">
                </div>
                <select class="form-control" id="sheetFilter" onchange="updateFilters()">
                    <option value="">Все листы</option>
                </select>
                <select class="form-control" id="groupBy" onchange="updateFilters()">
                    <option value="category">Группировка: По категории</option>
                    <option value="target">Группировка: По цели</option>
                    <option value="mode">Группировка: По режиму</option>
                </select>
                <label class="toggle-mini">
                    <input type="checkbox" id="showDisabled" checked onchange="updateFilters()">
                    Показывать откл.
                </label>
            </div>

            <div class="stats-grid" id="stats">
                <!-- Stats injected here -->
            </div>
        </section>

        <main id="rulesContainer">
            <!-- Rules groups injected here -->
        </main>
    </div>

    <div class="modal" id="ruleModal">
        <div class="modal-body">
            <div class="modal-header">
                <h2 id="modalTitle">Новое правило</h2>
                <button class="btn ghost" onclick="closeRuleModal()">✕</button>
            </div>
            <form id="ruleForm" onsubmit="submitRule(event)">
                <div class="form-row">
                    <div class="field" style="grid-column: span 2;">
                        <label>Режим работы</label>
                        <select class="form-select" id="ruleMode" onchange="toggleModeFields()">
                            <option value="unidirectional">Одностороннее (Источник ⟶ Потребитель)</option>
                            <option value="bidirectional">Двустороннее (Синхронно в обе стороны)</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="field">
                        <label class="toggle-mini"><input type="checkbox" id="ruleEnabled" checked> Правило
                            активно</label>
                    </div>
                    <div class="field">
                        <label class="toggle-mini"><input type="checkbox" id="isExternal" onchange="toggleExternal()">
                            Внешний документ</label>
                    </div>
                </div>

                <div class="form-row" id="externalRow" style="display:none">
                    <div class="field" style="grid-column: span 2;">
                        <label>ID внешнего документа</label>
                        <input type="text" class="form-input" id="targetDocId" placeholder="1Abc..."
                            onchange="onSheetsChanged()">
                    </div>
                </div>

                <div class="form-row">
                    <div class="field">
                        <label>Источник (лист)</label>
                        <select class="form-select" id="sourceSheet" onchange="onSheetsChanged()" required></select>
                    </div>
                    <div class="field">
                        <label>Цель (лист)</label>
                        <select class="form-select" id="targetSheet" onchange="onSheetsChanged()" required></select>
                    </div>
                </div>

                <div id="sharedWizard" class="wizard-panel">
                    <div class="wizard-header">
                        <span>✨ Групповой подбор</span>
                        <div class="wizard-actions">
                            <button type="button" class="btn ghost small" onclick="runDiscovery()"
                                title="Глобальный поиск">
                                🚀 Найти везде
                            </button>
                        </div>
                    </div>
                    <div id="wizardContainer" class="wizard-content">
                        <!-- Wizard options will appear here -->
                    </div>
                </div>

                <span class="help-text">Мы автоматически определим категорию по имени столбца.</span>

                <div class="modal-footer">
                    <button type="button" class="btn ghost" onclick="indexGlobal()" id="indexBtn">
                        🔍 Индексация
                    </button>
                    <button type="button" class="btn ghost" onclick="closeRuleModal()">Отмена</button>
                    <button type="submit" class="btn primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Logs Modal -->
    <div class="modal" id="logsModal">
        <div class="modal-body">
            <div class="modal-header">
                <h2>Журнал синхронизации (Сервер)</h2>
                <button class="btn ghost" onclick="closeLogsModal()">✕</button>
            </div>
            <div class="filter-bar">
                <input type="text" class="form-input" id="logSearch" placeholder="Поиск по ID/столбцу..."
                    oninput="loadSyncLogs()">
                <button class="btn secondary" onclick="loadSyncLogs()">Обновить</button>
            </div>
            <div class="log-table-container">
                <table class="log-table">
                    <thead>
                        <tr>
                            <th>Время</th>
                            <th>Объект</th>
                            <th>Поле</th>
                            <th>Было</th>
                            <th>Стало</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <!-- Logs injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const state = {
            rules: [],
            localSheets: [],
            cachedHeaders: {},
            editingId: null,
            spreadsheetId: "13kB77R67GJOZQ3vsLcwR1nUaRsupR8ZnEaTdDd66CTQ" // Default or injected
        };

        const api = {
            base: "/api/v1",
            fetch: async (path, opts = {}) => {
                const method = opts.method || "GET";
                const payload = opts.body ? JSON.parse(opts.body) : null;

                // GAS-Native Bridge
                if (typeof google !== "undefined" && google.script && google.script.run) {
                    return new Promise((resolve, reject) => {
                        google.script.run
                            .withSuccessHandler(res => {
                                if (res.status >= 200 && res.status < 300) {
                                    resolve(res.json || JSON.parse(res.content));
                                } else {
                                    const errorMsg = res.json?.detail || res.json?.error || res.content || "Server Error";
                                    notify(errorMsg, "error");
                                    reject(new Error(errorMsg));
                                }
                            })
                            .withFailureHandler(err => {
                                notify(err.message, "error");
                                reject(err);
                            })
                            .apiProxy(path.replace(/^\/api\/v1/, ""), method, payload);
                    });
                }

                // Fallback for local development
                try {
                    const r = await fetch(`${api.base}${path}`, opts);
                    if (!r.ok) throw new Error(await r.text());
                    return await r.json();
                } catch (e) {
                    notify(e.message, "error");
                    throw e;
                }
            }
        };

        function $(id) { return document.getElementById(id); }

        function notify(msg, type = "success") {
            const container = $("toastContainer");
            const t = document.createElement("div");
            t.className = `toast ${type}`;
            t.textContent = msg;
            container.appendChild(t);
            setTimeout(() => t.remove(), 4000);
        }

        // --- Core Rules Logic ---

        async function init() {
            // Get ID from URL or Storage
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id') || localStorage.getItem("last_ss_id") || state.spreadsheetId;
            state.spreadsheetId = id;
            localStorage.setItem("last_ss_id", id);

            await loadSheets();
            await loadRules();
        }

        async function loadRules() {
            const data = await api.fetch(`/rules/${state.spreadsheetId}?include_disabled=true`);
            state.rules = data.rules || [];
            updateFilters();
        }

        async function reloadRules() {
            await api.fetch(`/rules/${state.spreadsheetId}/reload`, { method: "POST" });
            notify("Кэш правил обновлен");
            await loadRules();
        }

        async function loadSheets() {
            try {
                const data = await api.fetch(`/meta/${state.spreadsheetId}/sheets`);
                state.localSheets = data.sheets || [];
                const options = `<option value="">Выберите лист...</option>` +
                    state.localSheets.map(s => `<option value="${s}">${s}</option>`).join("");
                $("sheetFilter").innerHTML = `<option value="">Все листы</option>` + options;
                updateModalDropdowns();
            } catch (e) { console.error("Sheets load failed", e); }
        }

        function updateModalDropdowns() {
            const options = `<option value="">Выберите лист...</option>` +
                state.localSheets.map(s => `<option value="${s}">${s}</option>`).join("");
            $("sourceSheet").innerHTML = options;
            if (!$("isExternal").checked) {
                $("targetSheet").innerHTML = options;
            }
        }

        // --- Smart Selection Logic ---

        async function onSheetsChanged() {
            const src = $("sourceSheet").value;
            const target = $("targetSheet").value;
            const isExt = $("isExternal").checked;
            const extId = $("targetDocId").value.trim();

            if (!src || (!target && (!isExt || !extId))) {
                $("sharedWizard").classList.remove("active");
                return;
            }

            $("sharedWizard").classList.add("active");
            $("wizardContainer").innerHTML = `<span>⏳ Анализ заголовков...</span>`;

            try {
                const srcHeaders = await getHeaders(state.spreadsheetId, src);
                let targetHeaders = [];

                if (isExt && extId && target) {
                    targetHeaders = await getHeaders(extId, target);
                } else if (!isExt && target) {
                    targetHeaders = await getHeaders(state.spreadsheetId, target);
                }

                const common = srcHeaders.filter(h => targetHeaders.includes(h));
                if (common.length) {
                    $("wizardContainer").innerHTML = `
                        <select class="form-select" id="sharedColumn">
                            <option value="">Выберите общий столбец (${common.length} найдено)...</option>
                            ${common.map(h => `<option value="${h}">${h}</option>`).join("")}
                        </select>
                    `;
                } else {
                    $("wizardContainer").innerHTML = `<span style="color:var(--danger)">Нет общих столбцов.</span>`;
                }
            } catch (e) {
                $("wizardContainer").innerHTML = `<span style="color:var(--danger)">Ошибка загрузки.</span>`;
            }
        }

        async function getHeaders(ssId, sheet) {
            if (state.cachedHeaders[ssId]?.[sheet]) return state.cachedHeaders[ssId][sheet];
            const data = await api.fetch(`/meta/${ssId}/${encodeURIComponent(sheet)}/headers`);
            if (!state.cachedHeaders[ssId]) state.cachedHeaders[ssId] = {};
            state.cachedHeaders[ssId][sheet] = data.headers || [];
            return data.headers;
        }

        // --- UI Rendering ---

        function updateFilters() {
            renderRules();
            renderStats();
        }

        function renderStats() {
            const total = state.rules.length;
            const active = state.rules.filter(r => r.enabled).length;
            const bi = state.rules.filter(r => r.mode === "bidirectional").length;
            const ext = state.rules.filter(r => r.is_external).length;

            $("stats").innerHTML = `
                <div class="stat-badge"><span class="label">Всего:</span><span class="value">${total}</span></div>
                <div class="stat-badge"><span class="label">Активных:</span><span class="value">${active}</span></div>
                <div class="stat-badge"><span class="label">⟷:</span><span class="value">${bi}</span></div>
                <div class="stat-badge"><span class="label">Внешних:</span><span class="value">${ext}</span></div>
            `;
        }

        function renderRules() {
            const container = $("rulesContainer");
            const search = $("search").value.toLowerCase();
            const sheetF = $("sheetFilter").value;
            const groupKey = $("groupBy").value;
            const showDisabled = $("showDisabled").checked;

            const filtered = state.rules.filter(r => {
                if (!showDisabled && !r.enabled) return false;
                if (sheetF && r.source_sheet !== sheetF && r.target_sheet !== sheetF && r.sheet_a !== sheetF) return false;
                const haystack = `${r.id} ${r.category} ${r.source_sheet} ${r.target_sheet} ${r.sheet_a} ${r.sheet_b}`.toLowerCase();
                return haystack.includes(search);
            });

            if (!filtered.length) {
                container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--muted)">Ничего не найдено</div>`;
                return;
            }

            // Grouping
            const groups = {};
            filtered.forEach(r => {
                let key = "Прочее";
                if (groupKey === "category") key = r.category || "Без категории";
                if (groupKey === "target") key = r.target_sheet || r.sheet_b || "Внешние/Прочее";
                if (groupKey === "mode") key = r.mode === "bidirectional" ? "Двусторонние" : "Односторонние";

                if (!groups[key]) groups[key] = [];
                groups[key].push(r);
            });

            container.innerHTML = Object.entries(groups).map(([title, items]) => {
                return `
                    <div class="group" id="grp-${title}">
                        <div class="group-header" onclick="this.parentElement.classList.toggle('collapsed')">
                            <span class="chevron">▼</span>
                            <span class="group-title">${title}</span>
                            <span class="group-count">${items.length}</span>
                        </div>
                        <div class="rules-grid">
                            ${items.map(r => renderRuleCard(r)).join("")}
                        </div>
                    </div>
                `;
            }).join("");
        }

        function renderRuleCard(r) {
            const isBi = r.mode === "bidirectional";
            const src = isBi ? r.sheet_a : r.source_sheet;
            const target = isBi ? r.sheet_b : r.target_sheet;
            const flow = isBi ? "⟷" : "⟶";

            return `
                <div class="rule-card ${r.enabled ? '' : 'disabled'}">
                    <div class="card-top">
                        <div class="card-badges">
                            <span class="pill category">${r.category}</span>
                            <span class="pill ${isBi ? 'bidir' : 'mode'}">${isBi ? 'Двустороннее' : 'Одностороннее'}</span>
                        </div>
                        <label class="switch">
                            <input type="checkbox" ${r.enabled ? 'checked' : ''} onchange="toggleRule('${r.id}', this.checked)">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="sync-flow">
                        ${src} <span>${flow}</span> ${target}
                    </div>
                    <div class="col-info">
                        Столбец: <strong>${isBi ? r.header_a : r.source_header}</strong>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-edit" onclick="openRuleModal('${r.id}')">Правка</button>
                        <button class="btn btn-delete" onclick="deleteRule('${r.id}')">Удалить</button>
                    </div>
                </div>
            `;
        }

        // --- Actions ---

        function openRuleModal(id = null) {
            state.editingId = id;
            const form = $("ruleForm");
            form.reset();
            $("modalTitle").textContent = id ? "Редактировать правило" : "Новое правило";
            $("sharedWizard").classList.remove("active");

            if (id) {
                const r = state.rules.find(x => x.id === id);
                if (r) {
                    $("ruleMode").value = r.mode;
                    $("ruleEnabled").checked = r.enabled;
                    $("isExternal").checked = !!r.is_external;
                    if (r.is_external) {
                        $("targetDocId").value = r.target_doc_id;
                        toggleExternal();
                    }
                    $("sourceSheet").value = r.source_sheet || r.sheet_a;

                    // Delay target sheet set as it might need external load
                    setTimeout(() => {
                        $("targetSheet").value = r.target_sheet || r.sheet_b;
                        onSheetsChanged().then(() => {
                            if ($("sharedColumn")) $("sharedColumn").value = r.source_header || r.header_a;
                        });
                    }, 100);
                }
            } else {
                updateModalDropdowns();
            }
            $("ruleModal").classList.add("active");
        }

        function closeRuleModal() { $("ruleModal").classList.remove("active"); }

        async function submitRule(e) {
            e.preventDefault();
            const mode = $("ruleMode").value;
            const col = $("sharedColumn")?.value;
            if (!col) return notify("Выберите общий столбец", "error");

            const payload = {
                id: state.editingId,
                enabled: $("ruleEnabled").checked,
                mode,
                category: col,
                is_external: $("isExternal").checked,
                target_doc_id: $("targetDocId").value.trim() || null
            };

            if (mode === "bidirectional") {
                payload.sheet_a = $("sourceSheet").value;
                payload.header_a = col;
                payload.sheet_b = $("targetSheet").value;
                payload.header_b = col;
            } else {
                payload.source_sheet = $("sourceSheet").value;
                payload.source_header = col;
                payload.target_sheet = $("targetSheet").value;
                payload.target_header = col;
            }

            const path = state.editingId ? `/rules/${state.spreadsheetId}/${state.editingId}` : `/rules/${state.spreadsheetId}/create`;
            const method = state.editingId ? "PATCH" : "POST";

            await api.fetch(path, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            notify(state.editingId ? "Правило обновлено" : "Правило создано");
            closeRuleModal();
            loadRules();
        }

        async function toggleRule(id, enabled) {
            await api.fetch(`/rules/${state.spreadsheetId}/${id}/toggle`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ enabled })
            });
            state.rules = state.rules.map(r => r.id === id ? { ...r, enabled } : r);
            renderStats();
            renderRules();
        }

        async function deleteRule(id) {
            if (!confirm("Удалить это правило?")) return;
            await api.fetch(`/rules/${state.spreadsheetId}/${id}`, { method: "DELETE" });
            notify("Правило удалено");
            loadRules();
        }

        // --- Helpers ---

        function toggleModeFields() {
            const isBi = $("ruleMode").value === "bidirectional";
            if (isBi) {
                $("isExternal").checked = false;
                $("isExternal").disabled = true;
                toggleExternal();
            } else {
                $("isExternal").disabled = false;
            }
        }

        async function toggleExternal() {
            const isExt = $("isExternal").checked;
            $("externalRow").style.display = isExt ? "grid" : "none";

            if (isExt) {
                const extId = $("targetDocId").value.trim();
                if (extId) {
                    $("targetSheet").innerHTML = `<option>Загрузка листов...</option>`;
                    const data = await api.fetch(`/meta/${extId}/sheets`);
                    $("targetSheet").innerHTML = `<option value="">Выберите лист...</option>` +
                        data.sheets.map(s => `<option value="${s}">${s}</option>`).join("");
                } else {
                    $("targetSheet").innerHTML = `<option>Укажите ID документа</option>`;
                }
            } else {
                updateModalDropdowns();
            }
        }

        // --- Logs Logic ---

        function openLogsModal() {
            $("logsModal").classList.add("active");
            loadSyncLogs();
        }
        function closeLogsModal() { $("logsModal").classList.remove("active"); }

        async function loadSyncLogs() {
            const search = $("logSearch").value;
            const data = await api.fetch(`/sync-logs/${state.spreadsheetId}?limit=50&row_key=${search}`);
            const body = $("logsTableBody");

            if (!data.items?.length) {
                body.innerHTML = `<tr><td colspan="6" style="text-align:center">Нет записей</td></tr>`;
                return;
            }

            body.innerHTML = data.items.map(l => {
                const time = new Date(l.timestamp).toLocaleTimeString();
                return `
                    <tr>
                        <td title="${l.timestamp}">${time}</td>
                        <td><strong>${l.row_key}</strong></td>
                        <td>${l.category}</td>
                        <td style="color:var(--muted)">${l.old_value || '-'}</td>
                        <td style="font-weight:600">${l.new_value}</td>
                        <td class="log-status ${l.status}">${l.status}</td>
                    </tr>
                `;
            }).join("");
        }

        // --- Metadata Cache Actions ---

        async function indexGlobal() {
            const btn = $("indexBtn");
            const original = btn.innerHTML;
            btn.innerHTML = "⏳ Индексация...";
            btn.disabled = true;

            try {
                await api.fetch("/meta/index", { method: "POST" });
                notify("Индексация запущена в фоновом режиме");

                // Poll for status
                const timer = setInterval(async () => {
                    const status = await api.fetch("/meta/index/status");
                    if (status.status !== "running") {
                        clearInterval(timer);
                        btn.innerHTML = original;
                        btn.disabled = false;
                        notify(`Индексация завершена: ${status.indexed_docs} док.`, "success");
                    } else {
                        btn.innerHTML = `⏳ ${status.progress_percent}%`;
                    }
                }, 2000);

            } catch (e) {
                btn.innerHTML = original;
                btn.disabled = false;
            }
        }

        async function runDiscovery() {
            const src = $("sourceSheet").value;
            const target = $("targetSheet").value;
            if (!src || !target) return notify("Выберите оба листа", "error");

            $("wizardContainer").innerHTML = `<span>🚀 Глобальный поиск соответствий...</span>`;
            try {
                const data = await api.fetch(`/meta/discovery?spreadsheet_id=${state.spreadsheetId}&sheet_name=${encodeURIComponent(src)}&target_spreadsheet_id=${state.spreadsheetId}&target_sheet_name=${encodeURIComponent(target)}`);

                if (data.exact_matches?.length || data.fuzzy_matches?.length) {
                    const all = [...data.exact_matches, ...data.fuzzy_matches];
                    const unique = [...new Set(all)];

                    $("wizardContainer").innerHTML = `
                        <select class="form-select" id="sharedColumn">
                            <option value="">Найдено соответствий: ${unique.length}</option>
                            ${unique.map(h => `<option value="${h}">${h}</option>`).join("")}
                        </select>
                    `;
                } else {
                    $("wizardContainer").innerHTML = `<span style="color:var(--danger)">Ничего не найдено глобально.</span>`;
                }
            } catch (e) {
                $("wizardContainer").innerHTML = `<span style="color:var(--danger)">Ошибка поиска.</span>`;
            }
        }

        init();
    </script>
</body>

</html>
